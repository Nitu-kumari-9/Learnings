<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Auto Ticket - Bikramganj to Raman Dihara</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="auto-ticket">

        <p class="ticket-top">LOCAL AUTO SERVICE</p>

        <h1 class="ticket-title">AUTO TICKET</h1>

        <p class="route-label">ROUTE</p>

        <h2 class="route-name">
            BIKRAMGANJ → RAMAN DIHARA
        </h2>

        <p class="from-text">
            BIKRAMGANJ
        </p>

        <p class="arrow">
            ↓
        </p>

        <p class="to-text">
            RAMAN DIHARA
        </p>

        <p class="fare-label">TOTAL CHARGE</p>

        <p class="fare-price">₹30</p>

        <p class="journey-text">
            THANK YOU
        </p>

        <p class="safe-text">
            HAVE A SAFE JOURNEY
        </p>

    </div>

</body>

</html>
