<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App - Raman Dihra</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="weather-card">

        <p class="app-name">WEATHER TODAY</p>

        <h1 class="location">RAMAN DIHRA, BIHAR</h1>

        <p class="time">SUNDAY • 6:00 PM</p>

        <p class="weather-icon">⛈️</p>

        <p class="temperature">30°C</p>

        <h2 class="condition">
            LIGHT THUNDERSTORMS AND RAIN
        </h2>

        <div class="weather-info">

            <div class="weather-item">
                <p class="info-title">PRECIPITATION</p>
                <p class="info-value">35%</p>
            </div>

            <div class="weather-item">
                <p class="info-title">HUMIDITY</p>
                <p class="info-value">77%</p>
            </div>

            <div class="weather-item">
                <p class="info-title">WIND</p>
                <p class="info-value">3 km/h</p>
            </div>

        </div>

        <p class="bottom-text">
            STAY SAFE • HAVE A NICE DAY
        </p>

    </div>

</body>

</html>
