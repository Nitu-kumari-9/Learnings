<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student ID Card</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <h1 class="title">Student ID Card</h1>
  <hr>

  <!-- Poora card yaha se shuru hota hai -->
  <div class="id-card">

    <!-- Card ka upar wala colored header -->
    <div class="card-header">Sandip University</div>

    <!-- Photo ke liye ek chota box, abhi khali hai -->
    <div class="photo-box">Photo</div>

    <!-- Student ka naam -->
    <div class="student-name">Nitu Kumari</div>

    <!-- Student ki details -->
    <div class="student-info">Course: BCA - 2nd Year</div>
    <div class="student-info">Village: Raman Dihara, Bikramganj</div>
    <div class="student-info">College: Sijoul, Madhubani, Bihar</div>

    <!-- Card ka niche wala footer strip -->
    <div class="card-footer">Valid for Academic Session</div>

  </div>

</body>
</html>
