<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Units Practice</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1 class="title">CSS Units Practice</h1>

    <div class="px-box">
        <p>PX</p>
        <span>Fixed Size</span>
    </div>

    <div class="percent-box">
        <p>%</p>
        <span>Parent Size</span>
    </div>

    <div class="em-box">
        <p>EM</p>
        <span>Parent Font Size</span>
    </div>

    <div class="rem-box">
        <p>REM</p>
        <span>Root Font Size</span>
    </div>

    <div class="vw-box">
        <p>VW</p>
        <span>Viewport Width</span>
    </div>

    <div class="vh-box">
        <p>VH</p>
        <span>Viewport Height</span>
    </div>

</body>

</html>
