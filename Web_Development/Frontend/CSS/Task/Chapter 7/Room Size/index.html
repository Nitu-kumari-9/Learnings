<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Room Size</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="room">

        <h1 class="title">MY ROOM</h1>

        <p class="room-size">ROOM SIZE: 300px</p>

        <div class="bed-area">
            <h2 class="bed-title">BED AREA</h2>
            <p class="bed-text">50% OF ROOM</p>
        </div>

        <div class="study-area">
            <h2 class="study-title">STUDY AREA</h2>
            <p class="study-text">2em TEXT</p>
        </div>

        <div class="door-area">
            <p class="door-text">DOOR</p>
        </div>

        <p class="screen-text">
            THIS SECTION USES VW AND VH
        </p>

    </div>

</body>

</html>
