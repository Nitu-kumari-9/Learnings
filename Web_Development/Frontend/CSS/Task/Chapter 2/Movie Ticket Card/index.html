<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Ticket</title>

    <!-- CSS file ko connect kiya -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Main ticket -->
    <div class="mastikaro">

        <!-- Ticket heading -->
        <h1 id="jhakas">MOVIE TICKET</h1>

        <!-- Movie name -->
        <h2 class="filmy">Avengers: Endgame</h2>

        <p>Screen: 03</p>
        <p>Seat: A12</p>

        <!-- Ticket details -->
        <div class="mastibx">
            <p>Date: 06 September 2026</p>
            <p>Time: 07:30 PM</p>
        </div>

        <!-- Price -->
        <h3 class="filmy">Ticket Price: ₹250</h3>

        <!-- Booking button -->
        <button>Book Ticket</button>

    </div>

</body>
</html>
