<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Clone - Profile</title>

<link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- ================= NAVBAR ================= -->
  <div class="navbar">
    <div class="nav-left">
      <span class="menu-icon">☰</span>
      <a href="index.html" class="logo">
        <span class="play-icon">▶</span>
        <span class="text">YouTube</span>
      </a>
    </div>

    <div class="nav-center">
      <div class="search-bar">
        <input type="text" placeholder="Search">
        <button>🔍</button>
      </div>
    </div>

    <div class="nav-right">
      <span>📹</span>
      <span>🔔</span>
      <!-- Hum already profile page pe hain -->
      <a href="profile.html" class="avatar">A</a>
    </div>
  </div>

  <!-- Home pe wapas jaane ka link -->
  <a href="index.html" class="back-link">← Home pe wapas jao</a>

  <!-- ================= PROFILE SECTION ================= -->
  <div class="profile-section">

    <div class="profile-pic">
      <img src="https://images.unsplash.com/photo-1788080567027-cdfc4ba881fe?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHw0fHx8ZW58MHx8fHx8" alt="Profile picture">
    </div>

    <div class="profile-info">

      <div class="username-row">
        <h2>Hello Buddy</h2>
        <button class="edit-btn">Edit Channel</button>
      </div>

      <div class="profile-stats">
        <div><span>24</span> subscribers</div>
        <div><span>18</span> videos</div>
      </div>

      <div class="profile-bio">
        <p>Web development aur coding tutorials banati hoon 💻</p>
        <p>HTML • CSS • JavaScript seekh rahi hoon aur seekha rahi hoon</p>
      </div>

    </div>

  </div>

</body>
</html>
