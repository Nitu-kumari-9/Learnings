<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Generator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Password Generator</h1>

        <!-- Password Display -->
        <div class="password-box">

            <input
                type="text"
                id="password"
                placeholder="Your password"
                readonly
            >

            <button id="copy-btn">
                Copy
            </button>

        </div>


        <!-- Password Length -->
        <div class="length-section">

            <label for="length">
                Password Length:
                <span id="length-value">12</span>
            </label>

            <input
                type="range"
                id="length"
                min="4"
                max="30"
                value="12"
            >

        </div>


        <!-- Options -->
        <div class="options">

            <label>
                <input type="checkbox" id="uppercase" checked>
                Uppercase Letters
            </label>

            <label>
                <input type="checkbox" id="lowercase" checked>
                Lowercase Letters
            </label>

            <label>
                <input type="checkbox" id="numbers" checked>
                Numbers
            </label>

            <label>
                <input type="checkbox" id="symbols" checked>
                Symbols
            </label>

        </div>


        <!-- Strength -->
        <div class="strength">

            <span>Password Strength:</span>

            <strong id="strength">
                Strong
            </strong>

        </div>


        <!-- Generate -->
        <button id="generate-btn">
            Generate Password
        </button>

    </div>


    <script src="script.js"></script>

</body>

</html>
